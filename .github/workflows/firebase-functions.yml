name: Firebase Functions Deploy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/firebase-functions.yml"
      - "firebase.json"
      - "functions/**"

concurrency:
  group: firebase-functions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.1
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Verify deployment secrets
        run: |
          test -n "$FIREBASE_PROJECT_ID"
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"

      - name: Authenticate Firebase service account
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Install Functions dependencies
        run: npm --prefix functions ci

      - name: Test Functions
        run: npm --prefix functions test

      - name: Build Functions
        run: npm --prefix functions run build

      - name: Deploy Functions
        run: npx firebase-tools deploy --only functions --project "$FIREBASE_PROJECT_ID" --non-interactive
